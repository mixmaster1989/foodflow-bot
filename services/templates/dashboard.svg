<svg width="800" height="{{ height }}" viewBox="0 0 800 {{ height }}" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Complex Gradients for Mesh Effect -->
    <radialGradient id="meshBlue" cx="100%" cy="0%" r="80%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#4facfe;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="meshPink" cx="0%" cy="100%" r="80%">
      <stop offset="0%" style="stop-color:#ff0099;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#ff0099;stop-opacity:0" />
    </radialGradient>
    
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#050508;stop-opacity:1" />
    </linearGradient>

    <!-- Glowing Progress Gradients -->
    {% set cal_pct = (totals.calories / goals.get('calories', 2000)) %}
    <linearGradient id="calRingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      {% if cal_pct > 1.1 %}
        <stop offset="0%" style="stop-color:#ff4b2b;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#ff416c;stop-opacity:1" />
      {% elif cal_pct > 0.9 %}
        <stop offset="0%" style="stop-color:#f8ff00;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#ffa500;stop-opacity:1" />
      {% else %}
        <stop offset="0%" style="stop-color:#00f2fe;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#4facfe;stop-opacity:1" />
      {% endif %}
    </linearGradient>

    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.03" />
    </linearGradient>

    <!-- Filters -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" />
  <rect width="100%" height="100%" fill="url(#meshBlue)" />
  <rect width="100%" height="100%" fill="url(#meshPink)" />
  
  <!-- Content -->
  <!-- Header -->
  <g transform="translate(40, 60)">
    <text font-family="Inter, sans-serif" font-size="48" font-weight="900" fill="#ffffff" style="letter-spacing: -1px;">{{ user_name }}</text>
    <text y="40" font-family="Inter, sans-serif" font-size="20" font-weight="500" fill="rgba(255,255,255,0.4)">{{ date }}</text>
  </g>

  <!-- Main Progress Card -->
  <g transform="translate(30, 160)">
    <rect width="740" height="360" rx="40" fill="url(#glassGradient)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
    
    <!-- Calories Display -->
    <g transform="translate(180, 180)">
      <!-- Background Circle -->
      <circle r="100" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="24" />
      <!-- Progress Circle -->
      <circle r="100" fill="none" stroke="url(#calRingGradient)" stroke-width="24" 
              stroke-dasharray="628" stroke-dashoffset="{{ 628 * (1 - min(cal_pct, 1.0)) }}" 
              stroke-linecap="round" transform="rotate(-90)" filter="url(#neonGlow)" />
      
      <text font-family="Inter, sans-serif" font-size="56" font-weight="900" fill="#ffffff" text-anchor="middle" y="10">{{ totals.calories|int }}</text>
      <text font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="rgba(255,255,255,0.4)" text-anchor="middle" y="40">{{ t('dashboard.kcal') }}</text>
      
      {% if cal_pct > 1.0 %}
      <text font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#ff416c" text-anchor="middle" y="-55">{{ t('dashboard.excess') }}</text>
      {% endif %}
    </g>

    <!-- Macros List -->
    <g transform="translate(360, 60)">
      {% set macro_w = 340 %}
      
      <!-- Protein -->
      <g transform="translate(0, 0)">
        <text font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="rgba(255,255,255,0.5)">{{ t('dashboard.protein') }}</text>
        <text x="{{ macro_w }}" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="end">{{ totals.protein|round(1) }}{{ t('dashboard.unit_g') }}</text>
        <rect y="15" width="{{ macro_w }}" height="14" rx="7" fill="rgba(255,255,255,0.05)" />
        <rect y="15" width="{{ macro_w * min(totals.protein / goals.get('protein', 100), 1.0) }}" height="14" rx="7" fill="#ff416c" filter="url(#softGlow)" />
      </g>

      <!-- Fat -->
      <g transform="translate(0, 85)">
        <text font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="rgba(255,255,255,0.5)">{{ t('dashboard.fat') }}</text>
        <text x="{{ macro_w }}" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="end">{{ totals.fat|round(1) }}{{ t('dashboard.unit_g') }}</text>
        <rect y="15" width="{{ macro_w }}" height="14" rx="7" fill="rgba(255,255,255,0.05)" />
        <rect y="15" width="{{ macro_w * min(totals.fat / goals.get('fat', 70), 1.0) }}" height="14" rx="7" fill="#f8ff00" filter="url(#softGlow)" />
      </g>

      <!-- Carbs -->
      <g transform="translate(0, 170)">
        <text font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="rgba(255,255,255,0.5)">{{ t('dashboard.carbs') }}</text>
        <text x="{{ macro_w }}" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="end">{{ totals.carbs|round(1) }}{{ t('dashboard.unit_g') }}</text>
        <rect y="15" width="{{ macro_w }}" height="14" rx="7" fill="rgba(255,255,255,0.05)" />
        <rect y="15" width="{{ macro_w * min(totals.carbs / goals.get('carbs', 250), 1.0) }}" height="14" rx="7" fill="#00f2fe" filter="url(#softGlow)" />
      </g>

      <!-- Fiber -->
      <g transform="translate(0, 255)">
        <text font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="rgba(255,255,255,0.5)">{{ t('dashboard.fiber') }}</text>
        <text x="{{ macro_w }}" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="end">{{ totals.fiber|round(1) }}{{ t('dashboard.unit_g') }}</text>
        <rect y="15" width="{{ macro_w }}" height="14" rx="7" fill="rgba(255,255,255,0.05)" />
        <rect y="15" width="{{ macro_w * min(totals.fiber / goals.get('fiber', 30), 1.0) }}" height="14" rx="7" fill="#50ff50" filter="url(#softGlow)" />
      </g>
    </g>
  </g>

  <!-- Water Section (Modern Pill style) -->
  <g transform="translate(30, 560)">
    <rect width="740" height="80" rx="25" fill="url(#glassGradient)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <text x="30" y="47" font-family="Inter, sans-serif" font-size="22" font-weight="800" fill="#ffffff">{{ t('dashboard.water') }}</text>
    <text x="710" y="47" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.5)" text-anchor="end">{{ water_total }} / {{ goals.get('water', 2000) }} {{ t('dashboard.unit_ml') }}</text>
    <rect x="180" y="32" width="350" height="16" rx="8" fill="rgba(255,255,255,0.05)" />
    <rect x="180" y="32" width="{{ 350 * min(water_total / goals.get('water', 2000), 1.0) }}" height="16" rx="8" fill="#4facfe" filter="url(#neonGlow)" />
  </g>

  <!-- Meals Section -->
  <g transform="translate(40, 700)">
    <text font-family="Inter, sans-serif" font-size="28" font-weight="900" fill="#ffffff" style="letter-spacing: -0.5px;">{{ t('dashboard.food_log') }}</text>
    
    {% for log in logs %}
    <g transform="translate(0, {{ 60 + loop.index0 * 90 }})">
      <!-- Item Background -->
      <rect width="720" height="70" rx="20" fill="rgba(255,255,255,0.03)" />
      
      <text x="20" y="42" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="rgba(255,255,255,0.3)">{{ log.date.strftime('%H:%M') }}</text>
      <text x="100" y="42" font-family="Inter, sans-serif" font-size="20" font-weight="600" fill="#ffffff">{{ log.product_name | truncate(40) }}</text>
      <text x="700" y="42" font-family="Inter, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="end">{{ log.calories | int }}</text>
    </g>
    {% endfor %}
  </g>

  <!-- Brand / Footer -->
  <g transform="translate(400, {{ height - 40 }})">
    <text font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="rgba(255,255,255,0.2)" text-anchor="middle">FOODFLOW AI • HIGH-END NUTRITION INTELLIGENCE</text>
  </g>
</svg>
